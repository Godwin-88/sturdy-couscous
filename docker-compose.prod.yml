version: "3.9"

# ── GCP production overrides ────────────────────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# This file hardens all services for production on GCP Compute Engine.

services:

  neo4j:
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"

  postgres:
    restart: always
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  api:
    restart: always
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --no-access-log
    volumes: []
    ports:
      - "0.0.0.0:8000:8000"

  agent-worker:
    restart: always

  frontend:
    deploy:
      replicas: 0

  prometheus:
    profiles: ["monitoring"]
    restart: always
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: ["monitoring"]
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
