# ── Local development: all services ───────────────────────────────────────────
# Usage: make up
# For production (GCP): docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  # ── Knowledge Graph ──────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: graphalpha-neo4j
    ports:
      - "7687:7687"   # Bolt protocol (agents connect here)
      - "7474:7474"   # Neo4j Browser UI (dev only)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./master.cypher:/graph/master.cypher:ro
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-graphalpha}
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell --fail-at-end -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-graphalpha} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Graph loader (runs once, then exits) ─────────────────────────────────────
  graph-loader:
    image: neo4j:5-community
    container_name: graphalpha-loader
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./master.cypher:/graph/master.cypher:ro
      - ./graph/schema/dreamdex_extension.cypher:/graph/dreamdex_extension.cypher:ro
      - ./graph/schema/creditgraph_extension.cypher:/graph/creditgraph_extension.cypher:ro
      - ./graph/schema/defi_extension.cypher:/graph/defi_extension.cypher:ro
    entrypoint: ["/bin/sh", "-c", "cat /graph/master.cypher /graph/dreamdex_extension.cypher /graph/creditgraph_extension.cypher /graph/defi_extension.cypher | cypher-shell --fail-at-end -u \"${NEO4J_USER:-neo4j}\" -p \"${NEO4J_PASSWORD:-graphalpha}\" -a bolt://neo4j:7687 && echo 'Graph loaded successfully'"]
    restart: "no"

  # ── Audit & portfolio state DB ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: graphalpha-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graphalpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-graphalpha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-graphalpha}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Inter-agent message queue ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: graphalpha-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend + all agents ────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: graphalpha-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app                  # hot-reload in dev
      - ./agent:/app/agent          # agents importable from api
      - ./backtest:/app/backtest    # backtest engine accessible from api
      - ./common:/app/common        # shared graph helper
      - ./tests:/app/tests          # pytest runs inside the container
      - ./schemas:/app/schemas      # JSON schema contracts (signal/order v1)
      - ./cpp-risk:/app/cpp-risk    # C++ adapters (tests + provenance)
      - ./infra:/app/infra          # infra fixtures (postgres init, prometheus)
      - ./docs:/app/docs            # P8 architecture/parity/runbook docs
      - ./docker-compose.yml:/app/docker-compose.yml
      - ./.env.example:/app/.env.example
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Agent worker (long-running loop) ─────────────────────────────────────────
  agent-worker:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: graphalpha-agent
    env_file: .env
    volumes:
      - ./agent:/app
      - ./common:/app/common
      - ./backtest:/app/backtest
      - ./schemas:/app/schemas      # validate_signal / validate_order contracts
    command: python3 orchestrator.py
    restart: unless-stopped

  # ── Backtesting (on-demand, not always running) ───────────────────────────────
  backtest:
    build:
      context: .
      dockerfile: backtest/Dockerfile
    container_name: graphalpha-backtest
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./backtest:/app/backtest
      - backtest_results:/app/backtest/results
    profiles: ["backtest"]

  # ── Interactive Brokers Gateway (paper trading) ────────────────────────────
  ib-gateway:
    image: ghcr.io/unusualalpha/ib-gateway-docker:latest
    container_name: graphalpha-ib-gateway
    env_file: .env
    environment:
      TWS_USERNAME: ${IBKR_USERNAME}
      TWS_PASSWORD: ${IBKR_PASSWORD}
      TRADING_MODE: ${IBKR_TRADING_MODE:-paper}
      READ_ONLY_API: "true"
    ports:
      - "4002:4002"
      - "4001:4001"
    volumes:
      - ibgateway_data:/home/ibgateway/ibc
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4002/health || nc -z localhost 4002"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    profiles: ["ibkr"]

  # ── C++ Risk & Execution Engine ─────────────────────────────────────────────
  risk-engine:
    build:
      context: .
      dockerfile: cpp-risk/Dockerfile
    container_name: graphalpha-risk-engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-graphalpha}
      POSTGRES_USER: ${POSTGRES_USER:-graphalpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SUBSCRIBE: "1"
      REDIS_SIGNALS_CHANNEL: "graphalpha:signals:v1"
      SHADOW_COMPARE: ${SHADOW_MODE:-false}
      IBKR_HOST: ib-gateway
      IBKR_PORT: 4002
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-1}
    volumes:
      - ./tests/fixtures:/workspace/tests/fixtures:ro

  # ── Monitoring ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: graphalpha-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:latest
    container_name: graphalpha-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus
    profiles: ["monitoring"]

  # ── React frontend (LOCAL DEV) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: graphalpha-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000

  # ── Somnia / DreamDEX relay (optional; profiles:[dreamdex] → invisible to make up) ──
  somnia-relay:
    build:
      context: ./dreamdex
      dockerfile: Dockerfile
    container_name: graphalpha-somnia-relay
    env_file:
      - .env
    environment:
      - SOMNIA_RPC_URL=${SOMNIA_RPC_URL:-https://dream-rpc.somnia.network}
      - SOMNIA_WALLET_ADDRESS=${SOMNIA_WALLET_ADDRESS:-}
      - SOMNIA_PRIVATE_KEY=${SOMNIA_PRIVATE_KEY:-}
      - DREAMDEX_TRADING_MODE=${DREAMDEX_TRADING_MODE:-paper}
      - DRY_RUN=${DRY_RUN:-1}
      - RELAY_API_KEY=${RELAY_API_KEY:-}
    ports:
      - "8450:8450"
    profiles: ["dreamdex"]

  # ── CreditGraph: Attestcoin relay (:8080) + execution relay (:8081) ─────────
  attestation-service:
    build:
      context: ./creditgraph/attestation-service
    container_name: graphalpha-attestation
    env_file:
      - .env
    environment:
      - SOURCE_RPC_URL=${SOURCE_RPC_URL:-https://sepolia.infura.io/v3/}
      - CREDITCOIN_RPC_URL=${CREDITCOIN_RPC_URL:-https://rpc.cc3-testnet.creditcoin.network}
      - ATTESTCOIN_PROVER_URL=${ATTESTCOIN_PROVER_URL:-https://proof-gen-api.cc3-testnet.creditcoin.network}
    ports:
      - "8080:8080"
    profiles: ["creditgraph"]

  execution-service:
    build:
      context: ./creditgraph/execution-service
    container_name: graphalpha-execution
    env_file:
      - .env
    environment:
      - CREDITCOIN_WS_URL=${CREDITCOIN_WS_URL:-wss://rpc.cc3-testnet.creditcoin.network}
      - CREDITCOIN_EXECUTOR_SEED=${CREDITCOIN_EXECUTOR_SEED:-}
    ports:
      - "8081:8081"
    profiles: ["creditgraph"]

# ── EVM DeFi relay (P11) — Sepolia testnet; profiles:[web3] → invisible to make up ──
  web3-relay:
    build:
      context: ./web3
    container_name: graphalpha-web3-relay
    env_file:
      - .env
    environment:
      - WEB3_ENABLED=${WEB3_ENABLED:-0}
      - WEB3_TRADING_MODE=${WEB3_TRADING_MODE:-paper}
      - WEB3_NETWORK=${WEB3_NETWORK:-sepolia}
      - WEB3_RPC_URL=${WEB3_RPC_URL:-https://rpc.sepolia.org}
      - WEB3_CHAIN_ID=${WEB3_CHAIN_ID:-11155111}
      - WEB3_PASSPORT_CONTRACT=${WEB3_PASSPORT_CONTRACT:-0x0}
      - WEB3_VERIFIER_CONTRACT=${WEB3_VERIFIER_CONTRACT:-0x0}
      - WEB3_ORACLE_AUTHORITY_PRIVATE_KEY=${WEB3_ORACLE_AUTHORITY_PRIVATE_KEY:-}
      - WEB3_WALLET_ADDRESS=${WEB3_WALLET_ADDRESS:-}
      - DRY_RUN=${DRY_RUN:-1}
      - RELAY_API_KEY=${WEB3_RELAY_API_KEY:-}
      - MIN_LP_EDGE_PCT=${MIN_LP_EDGE_PCT:-0.05}
      - MIN_LENDING_SPREAD_PCT=${MIN_LENDING_SPREAD_PCT:-0.02}
      - MIN_FUNDING_CARRY_PCT=${MIN_FUNDING_CARRY_PCT:-0.10}
      - MAX_LEVERAGE_X=${MAX_LEVERAGE_X:-2.0}
    ports:
      - "8460:8460"
    profiles: ["web3"]

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  backtest_results:
  ibgateway_data:
