# ── Local development: all services ───────────────────────────────────────────
# Usage: make up
# For production (Vultr): docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  # ── Knowledge Graph ──────────────────────────────────────────────────────────
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: graphalpha-memgraph
    ports:
      - "7687:7687"   # Bolt protocol (agents connect here)
      - "7444:7444"   # Memgraph Lab UI (dev only)
      - "3000:3000"   # Memgraph Lab web UI
    volumes:
      - memgraph_data:/var/lib/memgraph
      - memgraph_log:/var/log/memgraph
      - ./master.cypher:/graph/master.cypher:ro
    environment:
      MEMGRAPH_TELEMETRY_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host localhost --port 7687"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Graph loader (runs once, then exits) ─────────────────────────────────────
  graph-loader:
    image: memgraph/mgconsole:latest
    container_name: graphalpha-loader
    depends_on:
      memgraph:
        condition: service_healthy
    volumes:
      - ./master.cypher:/graph/master.cypher:ro
    entrypoint: >
      sh -c "cat /graph/master.cypher | mgconsole
             --host 127.0.0.1 --port 7687 &&
             echo 'Graph loaded successfully'"
    restart: "no"

  # ── Audit & portfolio state DB ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: graphalpha-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graphalpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-graphalpha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-graphalpha}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Inter-agent message queue ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: graphalpha-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend + all 5 agents ────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: graphalpha-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app                  # hot-reload in dev
      - ./agent:/app/agent          # agents importable from api
      - ./backtest:/app/backtest    # backtest engine accessible from api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Agent worker (long-running loop) ─────────────────────────────────────────
  agent-worker:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: graphalpha-agent
    env_file: .env
    volumes:
      - ./agent:/app
      - ./common:/app/common
      - ./backtest:/app/backtest
    command: python3 orchestrator.py
    restart: unless-stopped

  # ── Backtesting (on-demand, not always running) ───────────────────────────────
  backtest:
    build:
      context: .
      dockerfile: backtest/Dockerfile
    container_name: graphalpha-backtest
    depends_on:
      memgraph:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./backtest:/app/backtest
      - backtest_results:/app/backtest/results
    profiles: ["backtest"]          # only starts with: docker compose --profile backtest up

  # ── Interactive Brokers Gateway (paper trading) ────────────────────────────
  # Community headless IB Gateway with IBC for auto-login.
  # Connects to IBKR's paper trading environment on port 4002.
  # risk-engine connects over the internal Compose network.
  ib-gateway:
    image: ghcr.io/unusualalpha/ib-gateway-docker:latest
    container_name: graphalpha-ib-gateway
    env_file: .env
    environment:
      TWS_USERNAME: ${IBKR_USERNAME}
      TWS_PASSWORD: ${IBKR_PASSWORD}
      TRADING_MODE: ${IBKR_TRADING_MODE:-paper}
      READ_ONLY_API: "true"
    ports:
      - "4002:4002"     # Paper trading port (host access for debugging)
      - "4001:4001"     # Live trading port (mapped but unused in paper mode)
    volumes:
      - ibgateway_data:/home/ibgateway/ibc
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4002/health || nc -z localhost 4002"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    profiles: ["ibkr"]  # Only started when IBKR credentials are configured

  # ── C++ Risk & Execution Engine (subscribes to Redis, processes live signals) ─
  risk-engine:
    build:
      context: .
      dockerfile: cpp-risk/Dockerfile
    container_name: graphalpha-risk-engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ib-gateway is conditional via profiles: ["ibkr"]
      # When ibkr profile is active, docker compose ensures startup ordering
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-graphalpha}
      POSTGRES_USER: ${POSTGRES_USER:-graphalpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_SUBSCRIBE: "1"
      REDIS_SIGNALS_CHANNEL: "graphalpha:signals:v1"
      SHADOW_COMPARE: ${SHADOW_MODE:-false}
      IBKR_HOST: ib-gateway
      IBKR_PORT: 4002
      IBKR_CLIENT_ID: ${IBKR_CLIENT_ID:-1}
    volumes:
      - ./tests/fixtures:/workspace/tests/fixtures:ro

  # ── Monitoring ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: graphalpha-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:latest
    container_name: graphalpha-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus
    profiles: ["monitoring"]

  # ── React frontend (LOCAL DEV — always on; production goes to Vercel) ─────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: graphalpha-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules           # prevents host node_modules from bleeding in
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  memgraph_data:
  memgraph_log:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  backtest_results:
  ibgateway_data:
